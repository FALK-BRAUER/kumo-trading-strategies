name: backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --all-extras
        working-directory: .
      - name: Lint
        run: uv run ruff check .
        working-directory: .
      - name: Test
        run: uv run pytest -q
        working-directory: .
