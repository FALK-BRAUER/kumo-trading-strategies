name: merge-gate

# THE REQUIRED CHECK. Branch protection on `main` requires this job.

on:
  pull_request:

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: bin/check-public-tree.sh
